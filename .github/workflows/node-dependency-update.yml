name: Node.js Dependency Update

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Working directory for the project'
        required: false
        type: string
        default: '.'
      update-target:
        description: 'Update target: minor, patch, or latest'
        required: false
        type: string
        default: 'minor'
      base-branch:
        description: 'Base branch to create PR against'
        required: false
        type: string
        default: 'main'
      auto-merge:
        description: 'Auto-merge PR if CI passes'
        required: false
        type: boolean
        default: true
      reviewers:
        description: 'Comma-separated list of reviewers (optional)'
        required: false
        type: string
        default: ''
    secrets:
      gh-token:
        description: 'GitHub token with repo and workflow permissions (use PAT for auto-merge)'
        required: true

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-branch }}
          token: ${{ secrets.gh-token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Check for updates
        id: check-updates
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for ${{ inputs.update-target }} updates..."
          UPDATES=$(ncu --target=${{ inputs.update-target }} 2>/dev/null || true)

          if echo "$UPDATES" | grep -q "All dependencies match"; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No updates available"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Updates available:"
            echo "$UPDATES"
          fi

      - name: Apply updates
        if: steps.check-updates.outputs.has_updates == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: |
          ncu -u --target=${{ inputs.update-target }}
          npm install

      - name: Get update summary
        if: steps.check-updates.outputs.has_updates == 'true'
        id: summary
        working-directory: ${{ inputs.working-directory }}
        run: |
          BRANCH_NAME="deps/update-${{ inputs.update-target }}-$(date +%Y%m%d)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Get list of updated packages for PR body
          CHANGES=$(git diff package.json | grep -E '^\+.*":' | grep -v '^\+\+\+' | sed 's/^\+//' | head -20 || true)

          # Use delimiter for multiline output
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-updates.outputs.has_updates == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.gh-token }}
          commit-message: "chore(deps): update ${{ inputs.update-target }} dependencies"
          branch: ${{ steps.summary.outputs.branch_name }}
          base: ${{ inputs.base-branch }}
          title: "chore(deps): update ${{ inputs.update-target }} dependencies"
          body: |
            ## Automated Dependency Update

            This PR updates dependencies to their latest **${{ inputs.update-target }}** versions.

            ### Updated packages
            ```json
            ${{ steps.summary.outputs.changes }}
            ```

            ### What's changed
            - Updated using `ncu -u --target=${{ inputs.update-target }}`
            - Ran `npm install` to update lockfile

            ---
            *This PR was automatically created by the dependency update workflow.*
          labels: |
            dependencies
            automated
          reviewers: ${{ inputs.reviewers }}
          delete-branch: true

      - name: Enable auto-merge
        if: |
          steps.check-updates.outputs.has_updates == 'true' &&
          steps.create-pr.outputs.pull-request-number &&
          inputs.auto-merge
        env:
          GH_TOKEN: ${{ secrets.gh-token }}
        run: |
          echo "Enabling auto-merge for PR #${{ steps.create-pr.outputs.pull-request-number }}"
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} \
            --auto \
            --squash \
            --delete-branch

      - name: Summary
        if: steps.check-updates.outputs.has_updates == 'true'
        run: |
          echo "### Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Created:** #${{ steps.create-pr.outputs.pull-request-number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ steps.summary.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-merge:** ${{ inputs.auto-merge && 'Enabled' || 'Disabled' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View PR](${{ steps.create-pr.outputs.pull-request-url }})" >> $GITHUB_STEP_SUMMARY
